<title>Sound Alibi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy app bar over a soft-gray canvas. Banking pages use a wide two-column grid. The intervention takes over the canvas with a navy band and stage tracker; the Alibi Mission pairs a navy "story" dossier with a verification trail. Staff console = KPI strip, case queue, case workspace. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EEF1F5; --ink:#0E1B2E; --muted:#5A6678; --line:#E0E5EC; --line-2:#CDD5E0;
  --navy:#0B2545; --navy-2:#163A66; --on-navy:#EEF3FA; --on-navy-dim:#A3B5CE; --navy-line:rgba(255,255,255,.14);
  --teal:#0D7C80; --teal-ink:#FFFFFF; --teal-soft:#E0F1F1; --teal-on-navy:#7FD3D4;
  --ok:#17784A; --ok-soft:#E0F2E8; --warn:#9A5A00; --warn-soft:#FBF0DB; --bad:#B03A2E; --bad-soft:#FAE5E2;
  --sim:#5B47A6; --sim-soft:#EEEAF8; --pri:#0B2545; --pri-ink:#EEF3FA; --icon:#163A66;
  --shadow:0 1px 2px rgba(14,27,46,.06), 0 8px 24px -12px rgba(14,27,46,.14);
  --f-ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#09111C; --surface:#101A28; --sunk:#0C1522; --ink:#E6ECF4; --muted:#94A1B5; --line:#1F2D42; --line-2:#2B3B54;
  --navy:#081A31; --navy-2:#11284A; --on-navy:#E9F0F9; --on-navy-dim:#93A8C4; --navy-line:rgba(255,255,255,.12);
  --teal:#4FC0C1; --teal-ink:#041A1B; --teal-soft:#0F2E30; --teal-on-navy:#4FC0C1;
  --ok:#5DC793; --ok-soft:#11302A; --warn:#E8AC52; --warn-soft:#30261A; --bad:#F08E83; --bad-soft:#3A1E1C;
  --sim:#B8A6F1; --sim-soft:#251F3D; --pri:#4FC0C1; --pri-ink:#041A1B; --icon:#4FC0C1;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#09111C; --surface:#101A28; --sunk:#0C1522; --ink:#E6ECF4; --muted:#94A1B5; --line:#1F2D42; --line-2:#2B3B54;
  --navy:#081A31; --navy-2:#11284A; --on-navy:#E9F0F9; --on-navy-dim:#93A8C4; --navy-line:rgba(255,255,255,.12);
  --teal:#4FC0C1; --teal-ink:#041A1B; --teal-soft:#0F2E30; --teal-on-navy:#4FC0C1;
  --ok:#5DC793; --ok-soft:#11302A; --warn:#E8AC52; --warn-soft:#30261A; --bad:#F08E83; --bad-soft:#3A1E1C;
  --sim:#B8A6F1; --sim-soft:#251F3D; --pri:#4FC0C1; --pri-ink:#041A1B; --icon:#4FC0C1;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.big{font-size:18px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:650;letter-spacing:-.012em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86em}
.mono{font-family:var(--f-mono);font-size:.84em}
.serif{font-family:var(--f-display);font-weight:400;letter-spacing:0}
.ico{flex:none;display:inline-block;vertical-align:middle}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--on-navy)}
.nav .wrap{display:flex;align-items:center;gap:8px 22px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.06em;letter-spacing:-.01em;border:0;background:none;cursor:pointer;padding:4px;color:var(--on-navy)}
.logo .glyph{width:30px;height:30px;border-radius:9px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center}
.links{display:flex;gap:4px;margin-right:auto}
.links button{white-space:nowrap;border:0;background:none;color:var(--on-navy-dim);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:550}
.links button[aria-current="page"]{color:var(--on-navy);background:rgba(255,255,255,.08)}
.links button:hover{color:var(--on-navy)}
.navr{display:flex;align-items:center;gap:8px;margin-left:auto}
.vseg{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid var(--navy-line);border-radius:10px;padding:3px}
.vseg button{border:0;background:none;color:var(--on-navy-dim);padding:6px 11px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.88em;display:flex;gap:6px;align-items:center}
.vseg button[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}
.nbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--navy-line);background:rgba(255,255,255,.04);color:var(--on-navy);padding:7px 11px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.88em}
.nbtn[aria-pressed="true"],.nbtn[aria-expanded="true"]{background:rgba(255,255,255,.14)}
.count{background:var(--teal);color:var(--teal-ink);border-radius:999px;font-size:.78em;padding:0 6px;font-weight:700}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:50;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mi{display:grid;grid-template-columns:28px minmax(0,1fr) 18px;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer}
.mi:hover{background:var(--sunk)}
.mi.start .k{background:var(--navy);color:var(--on-navy)}
.mi.start b{color:var(--ink)}
.mi .k{width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.86em}
.mi[aria-checked="true"] .k{background:var(--teal);color:var(--teal-ink)}
.mi b{display:block;font-weight:650}
.mi span{font-size:.84em;color:var(--muted)}
.msep{height:1px;background:var(--line);margin:6px 4px}
.mrow{display:flex;gap:6px;padding:6px}
.mrow button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px;cursor:pointer;font-size:.86em;font-weight:600;display:flex;gap:6px;justify-content:center;align-items:center}
.mrow button[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-2);border:1px solid var(--navy-line);display:grid;place-items:center;font-weight:700;font-size:.92em;color:var(--on-navy)}
@media (max-width:1240px){.nbtn .t{display:none}}
@media (max-width:1060px){.links{display:none}}
.logo .wt{white-space:nowrap}
@media (max-width:520px){.logo .wt{display:none}.vseg button .t{display:none}.avatar{display:none}}

.disclaim{font-size:.8em;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.disclaim .dot{width:6px;height:6px;border-radius:50%;background:var(--sim)}
.foot{padding-block:22px 34px}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.card.pad{padding:20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch h3{font-size:1.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:11px 16px;font-weight:650;cursor:pointer;border:1px solid transparent;text-align:center;line-height:1.25;transition:background .15s, border-color .15s}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.teal{background:var(--teal);color:var(--teal-ink)}
.btn.sec{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.btn.sec:hover{border-color:var(--muted)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.dan{background:none;border-color:var(--bad);color:var(--bad)}
.btn.okb{background:var(--ok);color:var(--surface)}
.btn.sm{padding:7px 11px;font-size:.86em;border-radius:9px}
.btn.lg{padding:14px 20px;font-size:1.02em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rowb{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78em;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.4}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-teal{background:var(--teal-soft);color:var(--teal)} .p-sim{background:var(--sim-soft);color:var(--sim)} .p-mut{background:var(--sunk);color:var(--muted)}
.lbl{font-size:.86em;font-weight:600;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:0;font-size:.94em}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:11px;padding:11px 13px;width:100%}
.field input:focus,textarea:focus,.field select:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.hint{font-size:.84em;color:var(--muted)}
.enter{animation:enter .32s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:11px 16px;border-radius:12px;font-size:.92em;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}

/* banking */
.page{padding-block:28px 8px;display:flex;flex-direction:column;gap:22px}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.greet h1{font-size:2.1em;font-family:var(--f-display);font-weight:400;letter-spacing:0;line-height:1.1}
.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}
.acct{background:var(--navy);color:var(--on-navy);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.acct::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;border:1px solid var(--navy-line);box-shadow:0 0 0 40px rgba(255,255,255,.025),0 0 0 80px rgba(255,255,255,.018)}
.acct .top{display:flex;justify-content:space-between;gap:10px;position:relative;z-index:1}
.acct .bal{font-family:var(--f-display);font-size:3.2em;line-height:1;position:relative;z-index:1}
.acct .sub{color:var(--on-navy-dim);font-size:.9em}
.acct .actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.btn.on{background:var(--on-navy);color:var(--navy)}
.btn.ghostn{background:rgba(255,255,255,.08);color:var(--on-navy);border-color:var(--navy-line)}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.prot{display:flex;flex-direction:column;gap:14px}
.prot .hd{display:flex;gap:12px;align-items:center}
.badge{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;flex:none}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plist > div{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.92em;flex-wrap:wrap}
.plist > div:last-child{border-bottom:0}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qb{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font-weight:600}
.qb:hover{border-color:var(--line-2)}
.qb .i{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--icon)}
.tablewrap{overflow-x:auto}
table.tx{width:100%;border-collapse:collapse;min-width:620px}
table.tx th{text-align:left;font-weight:600;color:var(--muted);font-size:.84em;padding:10px 20px;border-bottom:1px solid var(--line)}
table.tx td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tx tr:last-child td{border-bottom:0}
table.tx .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.payee{display:flex;gap:12px;align-items:center}
.pav{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.8em;color:var(--muted);flex:none}
.notice{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;background:var(--warn-soft)}
.notice > .ico{color:var(--warn);margin-top:2px}

/* transfer */
.crumbs{display:flex;gap:6px;align-items:center;font-size:.9em;color:var(--muted);flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-weight:600}
.tgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.form{padding:24px;display:flex;flex-direction:column;gap:20px}
.amountbox{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line-2);border-radius:14px;padding:10px 16px;background:var(--surface)}
.amountbox:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.amountbox span{font-family:var(--f-display);font-size:2.2em;color:var(--muted)}
.amountbox input{border:0;padding:0;font-family:var(--f-display);font-size:2.6em;background:none;width:100%;outline:none;color:var(--ink);min-width:0}
.rails{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.rails{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rail{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left}
.rail b{display:block;font-weight:650}
.rail span{font-size:.8em;color:var(--muted)}
.rail[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.rtag{display:inline-flex;gap:6px;align-items:center;font-size:.86em;font-weight:600;color:var(--muted)}
.summary{padding:22px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.summary .big{font-family:var(--f-display);font-size:2.6em;line-height:1}
.srow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.94em}
.srow span:first-child{color:var(--muted)}
.srow span:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}

/* checking */
.checking{min-height:380px;display:grid;place-items:center;padding:24px}
.cbox{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;max-width:420px;width:100%}
.spinner{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--teal);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.clines{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;max-width:260px}
.clines div{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.95em;opacity:.35;transition:opacity .3s}
.clines div.on{opacity:1;color:var(--ink)}
.clines .ico{color:var(--teal)}

/* intervention */
.band{background:var(--navy);color:var(--on-navy)}
.band .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.bandtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bandtop .who{display:flex;gap:12px;align-items:center;min-width:0}
.bandtop .glyph{width:38px;height:38px;border-radius:11px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;flex:none}
.bandtop b{font-size:1.04em}
.bandtop .s{color:var(--on-navy-dim);font-size:.9em}
.heldchip{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid var(--navy-line);border-radius:999px;padding:6px 12px;font-size:.88em;font-weight:600}
.heldchip i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.heldchip.ok i{background:var(--ok)}
.stages{display:flex;overflow-x:auto;scrollbar-width:none}
.stage{display:flex;align-items:center;gap:8px;padding:10px 0 12px;margin-right:22px;color:var(--on-navy-dim);font-size:.88em;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.stage .n{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.78em}
.stage.done{color:var(--on-navy)} .stage.done .n{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.stage.cur{color:var(--on-navy);border-bottom-color:var(--teal-on-navy)}
.ibody{padding-block:30px 10px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.lead{display:flex;flex-direction:column;gap:20px;min-width:0}
.lead h1{font-family:var(--f-display);font-weight:400;font-size:2.6em;line-height:1.08;max-width:20ch}
.lead p.l{font-size:1.08em;color:var(--muted);max-width:56ch}
@media (max-width:560px){.lead h1,.ohead h1{font-size:2em}}
.noticed{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.noticed li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.noticed li:last-child{border-bottom:0}
.noticed .ico{color:var(--warn);margin-top:2px}
.paycard{padding:20px;display:flex;flex-direction:column;gap:14px}
.paycard .amt{font-family:var(--f-display);font-size:2.6em;line-height:1}
.priv{display:flex;gap:10px;align-items:flex-start;font-size:.9em;color:var(--muted);padding:0 4px}

.purposes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){.purposes{grid-template-columns:minmax(0,1fr)}}
.pc{display:flex;gap:12px;align-items:center;border:1px solid var(--line-2);border-radius:14px;padding:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:border-color .15s, background .15s}
.pc:hover{border-color:var(--muted)}
.pc .i{width:38px;height:38px;border-radius:11px;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--muted)}
.pc[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.pc[aria-pressed="true"] .i{background:var(--teal);color:var(--teal-ink)}
.pc b{font-weight:600}

/* Alibi Mission — signature */
.mgrid{display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:940px){.mgrid{grid-template-columns:minmax(0,1fr)}}

.storyq{font-family:var(--f-display);font-size:1.5em;line-height:1.25;font-style:italic;border-left:2px solid var(--teal-on-navy);padding-left:16px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;margin:0;font-size:.94em}

.relpick{display:flex;flex-direction:column;gap:8px}
.rchip{border:1px solid var(--navy-line);background:rgba(255,255,255,.06);color:var(--on-navy);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:.88em}

.dnote{font-size:.88em;color:var(--on-navy-dim);border-top:1px solid var(--navy-line);padding-top:14px}

.trail{display:flex;flex-direction:column}
.tstep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 16px;position:relative;padding-bottom:14px}
.tstep::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line-2)}

.tstep.flag .tnode{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.tcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,border-color .2s;min-width:0}
.tstep.active .tcard{border-color:var(--teal);box-shadow:var(--shadow);padding:20px 22px}

.answers{display:flex;flex-wrap:wrap;gap:8px}
.ans{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:.94em;display:inline-flex;gap:8px;align-items:center;transition:all .15s;text-align:left}
.ans:hover{border-color:var(--teal)}
.ans[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.ans.flagged[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.reveal{border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:enter .35s ease;min-width:0}
.reveal.ok{background:var(--ok-soft)} .reveal.warn{background:var(--warn-soft)} .reveal.teal{background:var(--teal-soft)}
.reveal h4{font-size:1.08em;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.reveal h4 .ico{margin-top:2px}
.reveal.ok h4 .ico{color:var(--ok)} .reveal.warn h4 .ico{color:var(--warn)} .reveal.teal h4 .ico{color:var(--teal)}

/* decide */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dc{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line-2);border-radius:16px;padding:16px;background:var(--surface);cursor:pointer;text-align:left;width:100%;transition:border-color .15s, box-shadow .15s}

.resp{display:flex;flex-direction:column}

.tracker li:last-child::before{display:none}

.tracker li.on .d{background:var(--teal);border-color:var(--teal)}

.queue{display:flex;flex-direction:column}

.sec h3{font-size:1em;margin-bottom:12px;display:flex;gap:8px;align-items:center}

.clear{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.88em;color:var(--muted)}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

/* insights drawer */
.scrim{position:fixed;inset:0;background:rgba(9,17,28,.38);z-index:44;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- final-round additions ---- */
[hidden]{display:none!important}

const OC_DEMO_URL = 'https://madame-alibi.example/unlock-fortune?price=1&plan=annual-renew&gift=prize';
const OC_DEMO_TEXT = 'Madame Alibi’s Premium Prophecy. Unlock your personalized prediction for just $1 today. Your $1 reading starts a Madame Alibi Insider membership. Your membership renews automatically at $200 per year, and the first annual charge is billed 7 days after your reading. To cancel, contact customer support.';
const OC_SHORT = ['bit.ly','tinyurl.com','t.co','goo.gl','is.gd','rb.gy','cutt.ly','ow.ly','shorturl.at','tiny.cc','buff.ly'];
const OC_TLD = ['top','xyz','click','loan','win','zip','mov','icu','cam','rest','gq','tk','ml','cf','work','support'];
const OC_BRANDS = ['soundcu','paypal','amazon','apple','netflix','venmo','zelle','cashapp','usps','fedex','microsoft','google','wellsfargo','bankofamerica'];
const OC_LURE = /(prize|winner|win|free|gift|claim|bonus|unlock|lucky|fortune|reward|congrat|urgent|verify|limited)/ig;
const OC_SUB = /(trial|renew|subscri|annual|monthly|yearly|recurring|membership|plan=)/ig;
function ocLink(raw){
  const out = { ok:false, host:'', items:[] }; let u; let s = String(raw||'').trim();
  if (!s) return null;
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s, out.assumed = true;
  try { u = new URL(s); } catch(e) { out.error = 'That doesn’t look like a web address. Check for typos or paste the full link.'; return out; }
  out.ok = true; const h = u.hostname.toLowerCase(); out.host = h; const labels = h.split('.'); const tld = labels[labels.length-1]; const root = labels.slice(-2).join('.');
  const add = (k,t,d) => out.items.push({k,t,d});
  if (u.protocol !== 'https:') add('bad','Not a secure (https) link', 'Real checkout pages use https. This one starts with ' + u.protocol.replace(':','') + '.');
  if (/^\d{1,3}(\.\d{1,3}){3}$/.test(h) || h.includes(':')) add('bad','Uses a raw number address','The link goes to an IP address instead of a business name.');
  if (h.includes('xn--')) add('bad','Uses look-alike characters','The address contains encoded characters that can imitate real brand names.');
  if (u.username || /@/.test(s.split('?')[0].replace(/^[a-z]+:\/\//i,''))) add('bad','Has an @ in the address','Text before an @ can disguise where the link really goes.');
  if (OC_SHORT.includes(h)) add('warn','Shortened link','You can’t see the real destination. Ask for the full address instead.');
  if (OC_TLD.includes(tld)) add('warn','Unusual ending (.' + tld + ')','This ending is often used for throwaway sites. That alone doesn’t prove fraud.');
  if (tld === 'example') add('info','Demo address','.example is reserved for demos and can’t be a real store. This is the Fortune Trap’s fictional link.');
  const brand = OC_BRANDS.find(b => labels.slice(0,-1).some(l => l.includes(b)) && !root.startsWith(b + '.'));
  if (brand) add('bad','Brand name mixed into the address','“' + brand + '” appears in the address, but the site is actually ' + root + ', not ' + brand + '’s own domain.');
  if ((h.match(/-/g)||[]).length >= 2 || labels.length >= 5) add('warn','Long or hyphen-heavy address','Scam sites often stack words and hyphens to look official.');
  const lure = [...new Set((decodeURIComponent(u.pathname + u.search).match(OC_LURE)||[]).map(x=>x.toLowerCase()))];
  if (lure.length) add('warn','Prize or urgency words in the link', 'Found: ' + lure.join(', ') + '.');
  const sub = [...new Set((decodeURIComponent(u.search + u.pathname).match(OC_SUB)||[]).map(x=>x.toLowerCase().replace('=','')))];
  if (sub.length) add('warn','Subscription words in the link', 'Found: ' + sub.join(', ') + '. The offer may renew or bill again.');
  if (h === 'soundcu.com' || h.endsWith('.soundcu.com')) add('info','Matches Sound Credit Union’s domain','Still type the address yourself rather than tapping a link in a message.');
  return out;
}
const OC_MONEY = /\$\s?(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/g;
const OC_IV = [
  {re:/\b(per|a|each|every)\s+year\b|\bannual(ly)?\b|\byearly\b|\/\s?(yr|year)\b/i,name:'Yearly',n:1},
  {re:/\b(per|a|each|every)\s+month\b|\bmonthly\b|\/\s?(mo|month)\b/i,name:'Monthly',n:12},
  {re:/\b(per|a|each|every)\s+week\b|\bweekly\b|\/\s?(wk|week)\b/i,name:'Weekly',n:52}];
function ocTerms(text){
  const t = String(text||'').trim(); if (!t) return null;
  const S2 = t.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean); const num = x => parseFloat(x.replace(/,/g,''));
  const r = { intro:null, rec:null, iv:null, renew:null, cancel:null, refund:null };
  for (const s of S2){

const REC_STAGES = ['Payment','Safety steps','Evidence Vault','Review','Case'];

      <div class="rowb">${readBtn()}<span class="heldchip"><i></i>Acting quickly gives the best chance to help</span></div></div>
    <div class="stages" aria-label="Progress">${REC_STAGES.map((n,i)=>`<div class="stage ${i<st||(st===4&&i===4)?'done':''} ${i===st&&st<4?'cur':''}"><span class="n">${i<st||(st===4&&i===4)?ic('check',11,3):i+1}</span>${n}</div>`).join('')}</div>
  </div></div>`;
}

  'Wire': ['Wire', 'Sound can ask the receiving bank to return a wire (a recall). It isn’t guaranteed, and the chance drops the longer it’s been.'],
  'ACH': ['ACH', 'Sound can request an ACH return. It isn’t guaranteed, and timing matters.'],
  'External Transfer': ['Transfer to another bank', 'Sound can request a return from the other bank. It isn’t guaranteed.'],
  'P2P': ['P2P', 'P2P payments can’t be recalled once sent. We can still report the recipient, help secure your account, and document what happened.'],
  'Bill Pay': ['Bill pay', 'If the payment hasn’t been delivered yet, we may be able to stop or trace it.'],
  'Cash': ['Cash', 'Cash handed to someone can’t be recovered by Sound. Report it to us and to local police.'],
  'Other': ['Other', 'Tell us what happened and we’ll review the options with you.']

function recPriority(c){
  const pays = c.report.payments; const total = pays.reduce((a,p)=>a+(+p.amount),0);
  const days = p => (new Date(sc_of(c).clock) - new Date(p.t))/864e5;
  const fresh = pays.filter(p=>recallable(p.rail) && days(p) <= 3);
  if (c.report.unauthorized) return ['High','Member reports activity they didn’t do. Possible account takeover, not confirmed.'];
  if (fresh.length) return ['High',`${fresh.length} recallable payment${fresh.length>1?'s':''} sent within 3 days. Recall chances fall with time.`];
  if (total >= 5000) return ['High',`Total reported is ${money(total)}.`];
  if (total >= 1000) return ['Medium',`Total reported is ${money(total)}. Recallable payments are older than 3 days.`];
  return ['Low',`Total reported is ${money(total)}.`];
}

    H('Member actions'); const acts = Object.entries(c.report.actions); L.push(acts.length ? acts.map(([k,v])=>`${{call:'Fraud team call',secure:'Sign-in secured',unauth:'Reported activity they didn’t do',review:'Asked for recovery review'}[k]}: ${v}`).join('. ') + '.' : 'None recorded.');
    if (c.report.unauthorized) L.push('Member says someone else may have made these payments. Account takeover is not confirmed.');
    H('Recovery workflow'); L.push(`Current: ${c.status}. ${c.recovery&&c.recovery.outcome?'Outcome: '+c.recovery.outcome+'.':'No outcome recorded.'} Any recovery request in this demo is simulated.`);

  } else {

    H('Pre-payment check'); L.push(`${cap(a.tier)} (${a.score}/100). Signals: ${a.signals.map(x=>x.label.toLowerCase()).join(', ')||'none'}.`);
    const ato = a.signals.filter(x=>x.id==='reset'||x.id==='profile'); L.push(ato.length?`Account-change signals present (${ato.map(x=>x.label.toLowerCase()).join(', ')}). Review for possible account takeover.`:'No recent password reset or profile change.');

    const m = c.purpose?MISSIONS[c.purpose]:null; if (m) m.steps.forEach((st,i)=>{ const o = st.opts.find(x=>x.v===c.answers[i]); if (o) L.push(`- ${relT(st.t,c.relation)}: ${o.l}${o.flag?' (warning sign)':''}`); });
    if (c.lock){ H('Purpose Lock'); L.push(`Locked ${c.lock.time}: ${c.lock.payee}, routing ${mask(c.lock.routing)}, account ${mask(c.lock.account)}, ${money(c.lock.amount)}.`);

}
function recNextSteps(c){

  if (c.report.unauthorized) out.push('Check recent password resets and contact-detail changes. Confirm with contact details from before any change.');
  if (pays.some(p=>recallable(p.rail)) && i<4) out.push('Prepare a recall or return request for recallable payments. Recovery isn’t guaranteed.');
  if (pays.some(p=>p.rail==='P2P')) out.push('P2P payments can’t be recalled. Report the recipient and document the loss.');
  if (pays.some(p=>p.rail==='Cash')) out.push('Cash can’t be recovered by Sound. Suggest a police report.');
  out.push('Tell the member to stop paying any “fees” to release funds, and to be wary of recovery offers.');
  if (i>=4 && i<5) out.push('Record the receiving institution’s response, then close the case.');
  return out;
}

/* ---------- pattern charts ---------- */
function stackBars(rows){
  return `<div class="bars">${rows.map(([l,total,part,sub])=>`<div class="barrow"><span class="bl">${esc(l)}</span><span class="bt two" role="img" aria-label="${esc(l)}: ${part} flagged of ${total}"><i class="all" style="width:100%"></i><i class="part" style="width:${total?part/total*100:0}%"></i></span><span class="bv num">${part.toLocaleString()} <span class="muted">/ ${total.toLocaleString()}</span></span>${sub?`<span class="bs">${esc(sub)}</span>`:''}</div>`).join('')}</div>`;
}
function weekly(base){
  const start = new Date('2026-08-31T00:00'); const wk = x => Math.floor((new Date(x.t)-start)/(7*864e5));
  const n = Math.floor((new Date(DATA.meta.last)-start)/(7*864e5))+1; const W = Array.from({length:n},(_,i)=>({ i, total:0, flagged:0, scam:0 }));
  base.forEach(x=>{ const w = W[wk(x)]; if (!w) return; w.total++; if (x.a.score>=30) w.flagged++; if (x.label==='scam') w.scam++; });
  const max = Math.max(1, ...W.map(w=>w.total));
  return `<div class="cols" role="img" aria-label="Payments per week, with flagged share">${W.map(w=>{ const d = new Date(start.getTime()+w.i*7*864e5);
    return `<div class="col"><span class="cv num">${w.flagged}<span class="muted">/${w.total}</span></span><div class="cbar"><i class="all" style="height:${w.total/max*100}%"></i><i class="part" style="height:${w.flagged/max*100}%"></i></div><span class="cl">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>`; }).join('')}</div>
    <div class="legend"><span><i class="b"></i>All payments</span><span><i class="a"></i>Flagged</span></div>`;
}
function patternsHTML(base){
  const fl = base.filter(x=>x.a.score>=30);

  const trig = {}; fl.forEach(x=>x.a.signals.forEach(s=>trig[s.id]=(trig[s.id]||0)+1));
  const B = [['Under $100',0,100],['$100 to $500',100,500],['$500 to $1,000',500,1000],['$1,000 to $5,000',1000,5000],['$5,000 to $10,000',5000,10000],['$10,000 and up',10000,Infinity]];
  const rails = [...new Set(base.map(x=>x.rail))];
  const recNew = base.filter(x=>x.recStatus==='New'), recOld = base.filter(x=>x.recStatus==='Existing'), recNA = base.filter(x=>x.recStatus!=='New' && x.recStatus!=='Existing');
  return `${filterBar(base)}
    <div class="intelgrid">
      <section class="card pad"><h3>Fraud categories</h3><p class="small muted">Scam-labeled payments by journey type, and how many the rules flag. Labels come from the Member Key.</p>
        ${Object.keys(cats).length?stackBars(Object.entries(cats).sort((a,b)=>b[1][0]-a[1][0]).map(([k,v])=>[k, v[0], v[1], `${pct(v[1],v[0])} flagged`])):'<p class="muted small">No scam-labeled payments in this filter.</p>'}</section>
      <section class="card pad"><h3>Most common risk triggers</h3><p class="small muted">Share of the ${fl.length} flagged payments where each rule fired.</p>
        ${fl.length?bars(Object.entries(trig).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[SIG_LABEL[k], v]), fl.length):'<p class="muted small">No flagged payments in this filter.</p>'}</section>
      <section class="card pad"><h3>Payment amounts</h3><p class="small muted">Payments in each amount range, and how many were flagged.</p>
        ${stackBars(B.map(([l,lo,hi])=>{ const r = base.filter(x=>x.amount>=lo && x.amount<hi); return [l, r.length, r.filter(x=>x.a.score>=30).length, `${r.filter(x=>x.label==='scam').length} scam-labeled`]; }))}</section>
      <section class="card pad"><h3>New vs. existing recipients</h3><p class="small muted">recipient_status at initiation. New means added 30 days ago or less.</p>
        ${stackBars([['New recipient', recNew.length, recNew.filter(x=>x.a.score>=30).length, `${recNew.filter(x=>x.label==='scam').length} scam-labeled (${pct(recNew.filter(x=>x.label==='scam').length, recNew.length)})`],
          ['Existing recipient', recOld.length, recOld.filter(x=>x.a.score>=30).length, `${recOld.filter(x=>x.label==='scam').length} scam-labeled (${pct(recOld.filter(x=>x.label==='scam').length, recOld.length)})`],
          ...(recNA.length?[['No recipient (cash)', recNA.length, recNA.filter(x=>x.a.score>=30).length, `${recNA.filter(x=>x.label==='scam').length} scam-labeled`]]:[])])}</section>
      <section class="card pad"><h3>Risk level by payment type</h3><p class="small muted">Count of payments at each risk level.</p>
        <div class="tablewrap"><table class="cmp"><thead><tr><th>Type</th><th>Low</th><th>Medium</th><th>High</th><th>Total</th></tr></thead><tbody>
        ${rails.sort().map(r=>{ const x = base.filter(t=>t.rail===r); const c = t => x.filter(y=>y.a.tier===t).length; return `<tr><td>${esc(r)}</td><td class="num">${c('low')}</td><td class="num">${c('medium')}</td><td class="num"><b>${c('high')}</b></td><td class="num">${x.length}</td></tr>`; }).join('')}</tbody></table></div></section>
      <section class="card pad"><h3>Over time</h3><p class="small muted">Payments initiated per week (week starting), with the flagged count.</p>${weekly(base)}</section>
    </div>`;
}

/* ---------- legitimate members ---------- */
function legitHTML(base){
  const fl = base.filter(x=>x.a.score>=30), non = base.filter(x=>x.label!=='scam'), fp = fl.filter(x=>x.label!=='scam');
  const look = base.filter(x=>x.label==='lookalike'), lookFl = look.filter(x=>x.a.score>=30);
  const trig = {}; fp.forEach(x=>x.a.signals.forEach(s=>trig[s.id]=(trig[s.id]||0)+1));
  const st = {}; fp.forEach(x=>{ const k = x.held ? (x.released ? 'Held, then released' : 'Held') : x.final; st[k]=(st[k]||0)+1; });
  const holds = fp.filter(x=>x.held && x.released).map(x=>{ const h = x.ev.find(e=>e.type==='Payment Held'), r = x.ev.find(e=>e.type==='Payment Released'); return (new Date(r.t)-new Date(h.t))/60000; }).sort((a,b)=>a-b);
  const med = holds.length ? holds[Math.floor((holds.length-1)/2)] + (holds.length%2?0:(holds[holds.length/2]-holds[Math.floor((holds.length-1)/2)])/2) : null;
  const dCase = CASES.find(c=>c.payment && c.payment.pid==='P1057-006' && c.releasedAt);
  return `${filterBar(base)}

        <h3 style="margin-top:14px">What happened to them (dataset)</h3>${Object.keys(st).length?bars(Object.entries(st).sort((a,b)=>b[1]-a[1]), fp.length, 'navy'):'<p class="muted small">None in this filter.</p>'}
        <dl class="kv small" style="margin-top:10px"><dt>Hold to release</dt><dd>${med!=null?`Median ${fmtDur(med)} across ${holds.length} held legitimate payments (today’s process)`:'Not available in this filter'}</dd>

      <section class="card pad"><h3>Triggers on legitimate payments</h3><p class="small muted">Which rules fired on the ${fp.length} flagged non-scam payments.</p>${fp.length?bars(Object.entries(trig).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[SIG_LABEL[k],v]), fp.length, 'navy'):'<p class="muted small">None in this filter.</p>'}</section>

function lrRecommend(r){
  const out = [];
  out.push(`Reach the member by ${r.contact==='phone'?'the phone number on file (not a number from the caller)':'secure in-app message'}. Tell them Sound will never ask for codes or passwords.`);
  if (r.signals.includes('code') || r.signals.includes('password') || r.done.includes('shared')) out.push('Check recent sign-ins, password resets, and contact-detail changes. Confirm changes using contact details from before any change.');
  if (r.done.includes('access')) out.push('Treat the device as compromised. Advise the member to disconnect it and reset credentials from a different device.');
  if (r.signals.includes('transfer') || r.done.includes('sent')) out.push('Look for new recipients or pending outgoing payments. Pending payments can be paused up to 4 hours under the challenge assumptions.');
  if (r.done.includes('sent')) out.push(r.recoveryCaseId ? `Recovery case ${r.recoveryCaseId} is open. Continue there.` : 'Help the member start Recovery Autopilot for money already sent.');
  return out;
}

function validateTransfer(){
  const e = {}, s = sc();

}

const FILE_OK = ['image/png','image/jpeg','application/pdf'], FILE_EXT = /\.(png|jpe?g|pdf)$/i, MAX_FILES = 5, MAX_BYTES = 5*1024*1024;
document.addEventListener('change', e => {
  const t = e.target;

    const r = S.rec, errs = [];

      if (!(FILE_OK.includes(f.type) || (!f.type && FILE_EXT.test(f.name))) || !FILE_EXT.test(f.name)) { errs.push(`${f.name}: only PNG, JPG, or PDF files.`); return; }
      if (f.size > MAX_BYTES) { errs.push(`${f.name}: larger than 5 MB.`); return; }

    case 's_call': { const cc = CASES.find(x=>x.id===el.dataset.id); cc.called = true; log(cc, 'Staff called member.', 'Staff'); render(); toast('Call logged'); break; }
    case 's_release': { const cc = CASES.find(x=>x.id===el.dataset.id); if(!cc.called){ toast('Log a call with the member before releasing'); break; } release(cc, 'Staff'); render(); toast('Payment released'); break; }
    case 's_cancel': { const cc = CASES.find(x=>x.id===el.dataset.id); setStatus(cc, 'Canceled at member’s request', 'Canceled by staff at member’s request.', 'Staff'); render(); toast('Payment canceled'); break; }
    case 's_esc': { const cc = CASES.find(x=>x.id===el.dataset.id); log(cc, 'Escalated to fraud team.', 'Staff'); render(); toast('Escalated to fraud team'); break; }
    case 'r_inv': { const cc = CASES.find(x=>x.id===el.dataset.id); setStatus(cc, 'Under Investigation', 'Employee started the investigation.', 'Staff'); render(); toast('Investigation started'); break; }
    case 'r_prep': { const cc = CASES.find(x=>x.id===el.dataset.id); setStatus(cc, 'Recovery Request Prepared', 'Recovery request prepared for recallable payments: ' + cc.report.payments.filter(p=>recallable(p.rail)).map(p=>money(+p.amount)+' '+p.rail).join(', ') + '.', 'Staff'); render(); toast('Recovery request prepared'); break; }
    case 'r_submit': { const cc = CASES.find(x=>x.id===el.dataset.id); setStatus(cc, 'Recovery Request Submitted (simulated)', 'Recovery request submitted to the receiving institution (simulated, nothing was sent). Recovery not guaranteed.', 'Staff'); render(); toast('Recovery request submitted (simulated)'); break; }
    case 'r_out_part': case 'r_out_none': case 'r_out_full': { const cc = CASES.find(x=>x.id===el.dataset.id); const t = {r_out_part:'Funds partially recovered',r_out_none:'Funds not recovered',r_out_full:'Funds fully recovered'}[act]+' (simulated)'; cc.recovery.outcome = t; log(cc, 'Outcome recorded: ' + t + '.', 'Staff'); render(); toast('Outcome recorded'); break; }
    case 'r_close': { const cc = CASES.find(x=>x.id===el.dataset.id); setStatus(cc, 'Closed', 'Case closed by employee.' + (cc.recovery.outcome?' Outcome: '+cc.recovery.outcome+'.':''), 'Staff'); render(); toast('Case closed'); break; }
  }
});
function selectEl(t){ const r = document.createRange(); r.selectNodeContents(t); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('keydown', e => { if (e.key==='Escape') { if (S.menu) { S.menu=false; render(); } else if (S.ixOpen) { const pid = S.ixOpen; S.ixOpen=null; render(); const r = document.querySelector(`button[data-act="ixOpen"][data-v="${pid}"]`); if (r) r.focus(); } else if (S.insights) { S.insights=false; render(); } } });

buildScenarios();
if (!load()) fresh('A');
render();

</script>
