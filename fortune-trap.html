<title>The $1 Fortune Trap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one centered phone-width column, one screen at a time; screens 1–3 are the fortune parlor, 4–5 switch to Sound Alibi's identity. Single deliberate dark look. */
:root{
  --night:#0E1230; --night2:#171B44; --plum:#2A1650; --violet:#8B5CF6; --teal:#2DD4BF; --gold:#F4C86A;
  --ink:#F3EEFF; --mute:#B9B2D9; --line:#3A3570; --danger:#FF8A9A;
  /* Sound Alibi tokens */
  --sa-bg:#1A0F2E; --sa-card:#2B1C48; --sa-border:#4B3478; --sa-lilac:#E8A3E9; --sa-pilltext:#5B21B6; --sa-pink:#F0A6EE; --sa-good:#6EE7C8;
  --f-display:'Cinzel', Georgia, serif; --f-body:'DM Sans', Arial, sans-serif; --f-caps:'Bebas Neue', Impact, sans-serif; --f-pixel:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px;
  background-image:radial-gradient(1200px 600px at 50% -10%, #2A1650 0%, transparent 60%),radial-gradient(2px 2px at 20% 30%, #ffffff55 50%, transparent 51%),radial-gradient(2px 2px at 80% 20%, #ffffff44 50%, transparent 51%),radial-gradient(1.5px 1.5px at 60% 70%, #ffffff33 50%, transparent 51%);
  transition:background-color .5s}
body.sa{background:var(--sa-bg);background-image:none}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sim{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.sim b{color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--teal)}
.screen{display:flex;flex-direction:column;gap:16px;animation:in .45s ease both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1:focus{outline:none}
.sub{color:var(--mute);margin:0;font-size:18px}
p{margin:0}
.btn{appearance:none;border:0;border-radius:14px;padding:16px 20px;font:700 18px var(--f-body);cursor:pointer;width:100%;color:#120B2A;background:linear-gradient(135deg,var(--teal),#7DD3FC);box-shadow:0 8px 24px #2DD4BF33}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn:focus-visible,.link:focus-visible,summary:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}
.back{align-self:flex-start;background:none;border:0;color:var(--mute);font:500 15px var(--f-body);cursor:pointer;padding:4px 0}
/* crystal ball + teller */
.stage{position:relative;height:280px;display:flex;align-items:flex-end;justify-content:center}
.teller{position:absolute;top:0;left:50%;transform:translateX(-50%);width:220px;height:200px}
.ball{position:relative;width:170px;height:170px;border-radius:50%;margin-bottom:28px;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#ffffffcc 0 6%,transparent 18%),radial-gradient(circle at 50% 55%,#5EEAD4 0%,#7C3AED 45%,#1E1B4B 80%);
  box-shadow:0 0 40px #8B5CF688,0 0 90px #2DD4BF44,inset 0 -18px 30px #0008}
.ball::before{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,#F4C86A55,transparent 30%,#2DD4BF66,transparent 60%);animation:swirl 6s linear infinite;mix-blend-mode:screen}
.ball .q{position:absolute;inset:0;display:grid;place-items:center;font:700 54px var(--f-display);color:#fff;text-shadow:0 0 18px #F4C86A;animation:pulse 2.4s ease-in-out infinite}
.base{position:absolute;bottom:0;width:150px;height:40px;border-radius:12px 12px 20px 20px;background:linear-gradient(#5B3A1E,#2E1A0C);box-shadow:0 6px 20px #0008}
@keyframes swirl{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.6;transform:scale(.94)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
/* checkout */
.card{background:var(--night2);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.merchant{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:radial-gradient(circle at 40% 35%,#5EEAD4,#7C3AED 70%);flex:none}
.merchant b{font-family:var(--f-display);font-size:17px}.merchant small{display:block;color:var(--mute);font-size:13px}
.price{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.price .big{font:700 40px var(--f-display);color:var(--gold)}
.fine{font-size:14px;color:var(--mute)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#0E1230}
summary{cursor:pointer;font-weight:700}
.terms{font-size:15px;color:var(--ink);margin-top:10px;line-height:1.55}
mark{background:#F4C86A33;color:var(--gold);border-bottom:2px solid var(--gold);padding:0 2px;border-radius:3px}
mark.amt{background:#FF8A9A2a;color:#FFC2CB;border-color:var(--danger)}
/* reveal */
.reveal h1{color:var(--gold)}
.shake{animation:shake .5s ease both}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.sum{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-variant-numeric:tabular-nums}
.sum div{padding:12px 14px;border-top:1px solid var(--line)}
.sum div:nth-child(-n+2){border-top:0}
.sum .v{text-align:right;font-weight:700}
.sum .tot{background:#F4C86A1f;color:var(--gold);font-weight:700}
/* Sound Alibi screens */
body.sa .sim{border-color:var(--sa-border)} body.sa .sim b{color:var(--sa-pink)}
body.sa .dots i{background:var(--sa-border)} body.sa .dots i.on{background:var(--sa-lilac)}
.sa-pill{align-self:flex-start;font:700 14px var(--f-pixel);color:var(--sa-pilltext);background:var(--sa-lilac);border-radius:999px;padding:6px 14px;letter-spacing:.04em}
.sa h1{font-family:var(--f-caps);font-weight:400;font-size:44px;letter-spacing:.02em;line-height:1}
.sa .card{background:var(--sa-card);border-color:var(--sa-border)}
.sa .btn{background:var(--sa-lilac);color:var(--sa-pilltext);box-shadow:0 8px 24px #E8A3E933}
.sa .btn.ghost{background:transparent;color:var(--ink);border-color:var(--sa-border)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--sa-border);border-radius:12px;padding:10px 12px;background:#1F1336;opacity:.25;transition:opacity .35s}
.checks li.show{opacity:1}
.tag{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap;margin-top:2px}
.t-ok{background:#6EE7C822;color:var(--sa-good);border:1px solid #6EE7C866}
.t-warn{background:#F4C86A22;color:var(--gold);border:1px solid #F4C86A66}
.t-miss{background:#FF8A9A22;color:#FFC2CB;border:1px solid #FF8A9A66}
.checks b{display:block}.checks q{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare div{border-radius:14px;padding:14px;border:1px solid var(--sa-border);background:var(--sa-card)}
.compare small{display:block;color:var(--mute);font-size:13px;line-height:1.35}
.compare strong{display:block;font:400 44px var(--f-caps);letter-spacing:.02em;margin-top:4px}
.compare .hi{border-color:var(--sa-pink);background:#3A1E52}.compare .hi strong{color:var(--sa-pink)}
.warn{display:flex;gap:10px;align-items:flex-start;background:#F0A6EE1a;border:1px solid var(--sa-pink);border-radius:12px;padding:12px 14px;font-weight:500}
.method{font-size:13px;color:var(--mute)}
textarea{width:100%;min-height:130px;border-radius:12px;border:1px solid var(--sa-border);background:#140A26;color:var(--ink);font:15px/1.5 var(--f-body);padding:12px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
/* final */
.burst{position:relative;height:150px;display:grid;place-items:center}
.seal{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:var(--sa-lilac);color:var(--sa-pilltext);box-shadow:0 0 0 10px #E8A3E922,0 0 60px #E8A3E966;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.seal svg{width:56px;height:56px}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--sa-good);animation:fly 1s ease-out both}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes fly{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--x),var(--y));opacity:0}}
.brand{text-align:center;display:flex;flex-direction:column;gap:4px;padding:8px 0}
.brand .n{font:700 30px var(--f-pixel);color:var(--sa-lilac)}
.brand .t{font:400 26px var(--f-caps);letter-spacing:.04em;color:var(--sa-pink)}
a.btn{display:block;text-align:center;text-decoration:none}
.foot{font-size:12px;color:var(--mute);text-align:center}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.addr{display:flex;align-items:center;gap:8px;background:#0E1230;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:13px ui-monospace,Menlo,monospace;color:var(--mute);overflow-wrap:anywhere}
.addr .lk{width:10px;height:10px;border-radius:50%;border:2px solid var(--teal);flex:none}
.hud{display:flex;justify-content:space-between;align-items:center;font:600 15px var(--f-body);color:var(--mute)}
.hud b{color:var(--gold);font-variant-numeric:tabular-nums}
.lines{display:flex;flex-direction:column;gap:8px}
.line{appearance:none;text-align:left;width:100%;font:15px/1.45 var(--f-body);color:var(--ink);background:var(--night2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .15s,border-color .2s}
.line:hover{border-color:var(--violet);transform:translateX(3px)}
.line.no{opacity:.45;border-style:dashed;cursor:default;transform:none}
.line.yes{border-color:var(--gold);background:#F4C86A1f;color:var(--gold)}
.bubble{display:flex;gap:10px;align-items:flex-start;background:#2A1650;border:1px solid var(--violet);border-radius:14px;padding:12px 14px;font-size:15px}
.bubble .av{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 35%,#5EEAD4,#7C3AED 70%)}
.copybox{display:flex;flex-direction:column;gap:8px;background:var(--night2);border:1px dashed var(--teal);border-radius:14px;padding:14px}
.copybox code{font:13px ui-monospace,Menlo,monospace;color:var(--teal);overflow-wrap:anywhere;user-select:all}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details.tiny{border:0;background:none;padding:0;font-size:10px;line-height:1.35;color:#6F6898}
details.tiny summary{font-weight:400;font-size:10px;color:#6F6898}
details.tiny p{margin-top:4px}
.final h1{text-align:center}
.ball.tap{display:block;padding:0;transition:transform .2s}
.ball.tap:active{transform:scale(.95)!important}.final .sub{text-align:center}
.brand .n{color:var(--gold)}.brand .t{color:var(--teal)}
.seal{background:var(--gold);color:#2A1650;box-shadow:0 0 0 10px #F4C86A22,0 0 60px #F4C86A66}
</style>

<div class="wrap">
  <div class="sim" role="note"><span><b>Simulation game</b> · fictional offer, no real payment</span><span class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
  <main id="app" aria-live="polite"></main>
  <p class="foot">Educational game for Husky Hack 2026. No payment details or personal information are collected.</p>
</div>

<script>
const SA_URL='https://claude.ai/artifact/FCUkGctpBUTy5EVRS2XHF4';
const LINK='https://madame-alibi.example/unlock-fortune?price=1&plan=annual-renew&gift=prize';
const TERMS=[
 'Madame Alibi’s Premium Prophecy.',
 'Unlock your personalized prediction for just $1 today.',
 'Your $1 reading starts a Madame Alibi Insider membership.',
 'Your membership renews automatically at $200 per year, and the first annual charge is billed 7 days after your reading.',
 'To cancel, contact customer support.'];
const CATCH=3;
const HINTS={0:'That’s just the name of the offer. Look for a second price.',1:'That’s the $1 the ad wants you to see. Where else does money come up?',2:'Close! “Membership” is a clue. Which line says what the membership costs?',4:'Vague, but not the catch itself. Find the line with a bigger number.'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app'); let step=1, charge=0;
const FORTUNES=['I see… a team called Sound Alibi…','The mists swirl… a judge is smiling…','The vision grows cloudy… the full prophecy is locked.'];
function setDots(){document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<step))}
function go(n){step=n;render();window.scrollTo({top:0});const h=app.querySelector('h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}}
const back=n=>`<button class="back" data-go="${n}">← Back</button>`;
const tellerSVG=`<svg class="teller" viewBox="0 0 220 200" aria-hidden="true">
 <path d="M110 8c-46 0-70 44-74 96-2 24 6 44 18 56h112c12-12 20-32 18-56-4-52-28-96-74-96z" fill="#3B1D6E"/>
 <path d="M110 30c-30 0-46 30-46 64 0 20 8 34 20 42h52c12-8 20-22 20-42 0-34-16-64-46-64z" fill="#1A0F2E"/>
 <ellipse cx="94" cy="88" rx="7" ry="4" fill="#5EEAD4"/><ellipse cx="126" cy="88" rx="7" ry="4" fill="#5EEAD4"/>
 <path d="M98 108q12 8 24 0" stroke="#F4C86A" stroke-width="3" fill="none" stroke-linecap="round"/>
 <circle cx="110" cy="40" r="6" fill="#F4C86A"/><path d="M60 150q50-20 100 0" stroke="#F4C86A" stroke-width="2" fill="none" opacity=".6"/>
 <path d="M30 40l3 7 7 3-7 3-3 7-3-7-7-3 7-3z M190 60l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#F4C86A"/></svg>`;
const screens={
1:()=>`<section class="screen">
  <div class="stage">${tellerSVG}<div class="ball" role="img" aria-label="Glowing crystal ball"><span class="q">?</span></div><div class="base"></div></div>
  <h1>Will Sound Alibi win $15,000 today?</h1>
  <p class="sub">The future is mysterious. Madame Alibi might know.</p>
  <button class="btn" data-act="start">Reveal My Fortune</button>
</section>`,
2:()=>`<section class="screen">${back(1)}
  <h1>Charge the crystal ball.</h1>
  <div class="bubble"><span class="av" aria-hidden="true"></span><span>${charge?esc(FORTUNES[charge-1]):'Tap the ball three times to wake the spirits.'}</span></div>
  <div class="stage" style="height:220px"><button class="ball tap" data-act="tap" aria-label="Tap the crystal ball (${charge} of 3)" style="border:0;cursor:pointer;transform:scale(${1+charge*0.06})"><span class="q">${charge<3?3-charge:'✦'}</span></button><div class="base"></div></div>
  <div class="hud"><span>Energy</span><b>${'●'.repeat(charge)}${'○'.repeat(3-charge)}</b></div>
  ${charge>=3?'<button class="btn" data-go="3">See the full prophecy</button>':''}
</section>`,
3:()=>`<section class="screen">${back(2)}
  <h1>Your future is only $1 away.</h1>
  <div class="card" aria-label="Fictional checkout offer">
    <div class="addr" aria-label="Fictional offer link"><span class="lk" aria-hidden="true"></span>${esc(LINK)}</div>
    <div class="merchant"><span class="logo" aria-hidden="true"></span><span><b>Madame Alibi’s Premium Prophecy</b><small>Fictional merchant</small></span></div>
    <p>Unlock the full prophecy: will Sound Alibi win?</p>
    <div class="price"><span>Just</span><span class="big">$1</span></div>
    <details id="det" class="tiny"><summary>Terms apply</summary><p>${esc(TERMS.join(' '))}</p></details>
  </div>
  <button class="btn" data-go="4">Unlock for $1</button>
  <p class="fine" style="text-align:center">Simulation only. Nothing is charged and there are no card fields.</p>
</section>`,
4:()=>`<section class="screen final">
  <div class="stage" style="height:200px">${tellerSVG}</div>
  <h1>Wait. Before you pay…</h1>
  <p class="sub">Madame Alibi can’t see what this $1 really costs. Can you? Ask Sound Alibi to check the offer.</p>
  <div class="copybox"><b>Check this offer in Sound Alibi</b>
    <code id="lnk">${esc(LINK)}</code>
    <button class="btn" data-act="copy" id="copyBtn">Copy the offer link</button>
    <ol class="steps"><li>Open Sound Alibi.</li><li>Go to the <b>Offer Check</b> tab.</li><li>Paste the link and select <b>Check offer</b>.</li></ol>
  </div>
  <a class="btn ghost" href="${SA_URL}" target="_blank" rel="noopener">Open Sound Alibi</a>
  <div class="brand"><span class="n">SOUND ALIBI</span><span class="t">Verify the story. Not just the identity.</span></div>
  <button class="btn ghost" data-act="restart">Play Again</button>
</section>`};
function render(){app.innerHTML=screens[step]();setDots();}
app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  if(a.dataset.act==='start'){charge=0;go(2);}
  if(a.dataset.act==='tap'&&charge<3){charge++;render();const t=app.querySelector(charge<3?'[data-act="tap"]':'[data-go="3"]');if(t)t.focus();}
  if(a.dataset.act==='restart'){charge=0;go(1);}
  if(a.dataset.act==='copy'){const done=()=>{a.textContent='Copied. Now paste it in Offer Check.'};
    try{navigator.clipboard.writeText(LINK).then(done,()=>{sel();a.textContent='Selected. Press Copy on your device.'})}catch(_){sel();a.textContent='Selected. Press Copy on your device.'}}
});
function sel(){const r=document.createRange();r.selectNodeContents(document.getElementById('lnk'));const s=getSelection();s.removeAllRanges();s.addRange(r);}
render();
</script>
